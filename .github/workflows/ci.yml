name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings allowed)
        run: npm run lint -- --max-warnings=0

      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      # Linux also compiles and simulates every example and part test with a
      # real arduino-cli; the other systems run the tests that need no toolchain.
      - name: Setup arduino-cli
        if: runner.os == 'Linux'
        uses: arduino/setup-arduino-cli@v2

      - name: Install the AVR core and test libraries
        if: runner.os == 'Linux'
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          # The versions the tests were written against, dependencies included.
          ARDUINO_DIRECTORIES_USER="$RUNNER_TEMP/arduino-user" arduino-cli lib install --no-deps \
            "Servo@1.3.0" "LiquidCrystal@1.0.7" "LiquidCrystal I2C@1.1.2" \
            "Adafruit BusIO@1.17.4" "Adafruit GFX Library@1.12.6" "Adafruit SSD1306@2.5.17" \
            "Adafruit NeoPixel@1.15.5" "Adafruit Unified Sensor@1.1.15" "DHT sensor library@1.4.7" \
            "Keypad@3.1.1" "IRremote@4.7.1" "AccelStepper@1.64" "Stepper@1.1.3" "LedControl@1.0.6" \
            "RTClib@2.1.4" "HX711@0.6.5" "Adafruit MPU6050@2.2.9" "SevSeg@3.7.0" \
            "OneWire@2.3.8" "DallasTemperature@4.0.6" "TM1637@1.2.0"
          echo "IMPULSE_TEST_LIBRARIES=$RUNNER_TEMP/arduino-user/libraries" >> "$GITHUB_ENV"

      - name: Unit and end-to-end tests
        run: npm test

      - name: Build renderer (Vite)
        run: npm run build:renderer

      - name: Build the impulse-test bundle
        run: |
          npm run build:cli
          node dist-cli/impulse-test.mjs --version

      # The standalone bundle, the way a project's own CI would run it.
      - name: impulse-test on a sketch (bundle)
        if: runner.os == 'Linux'
        run: node dist-cli/impulse-test.mjs test/fixtures/sketches --junit "$RUNNER_TEMP/impulse-test.xml"

      - name: Smoke test (launch app, open every panel and the simulator)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:smoke

      - name: Smoke test (launch app, open every panel and the simulator)
        if: runner.os != 'Linux'
        run: npm run test:smoke

      - name: End-to-end flows and accessibility audit
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

      - name: End-to-end flows and accessibility audit
        if: runner.os != 'Linux'
        run: npm run test:e2e

  # PlatformIO projects: a real build, simulation and debug session
  # (src/main/services/__tests__/platformio.test.js).
  platformio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-6.2.0-${{ hashFiles('test/fixtures/platformio/**/platformio.ini') }}

      - name: Install PlatformIO Core
        run: pip install platformio==6.2.0

      - name: Install dependencies
        run: npm ci

      - name: Build, simulate and debug a PlatformIO project
        run: IMPULSE_PIO_TESTS=1 npx jest src/main/services/__tests__/platformio.test.js
